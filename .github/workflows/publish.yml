name: Publish

# Publishes to npm with provenance when the version in package.json on master is not on npm yet,
# then tags the commit. Also runnable by hand from the Actions tab.
#
# npm auth is trusted publishing (OIDC): add this repository and workflow (publish.yml) as a
# Trusted Publisher for the package on npmjs.com. No token is stored anywhere.

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org

      - name: Check whether the version is new
        id: version
        run: |
          version=$(jq -r .version package.json)
          published=$(npm view "$(jq -r .name package.json)@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$version is already on npm, nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and test
        if: steps.version.outputs.new == 'true'
        run: |
          npm ci
          npm test

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
